<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#24312c;background:transparent}
#wrap{max-width:460px;padding:4px}#board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;touch-action:none;border:3px solid #394d42;border-radius:5px;overflow:hidden;user-select:none}
.square{position:relative;border:0;padding:0;display:grid;place-items:center;min-width:0;background:#ece6d5;cursor:pointer;border-radius:0;touch-action:none}
.dark{background:#7c9984}.square svg{width:88%;height:88%;pointer-events:none}.square.selected{box-shadow:inset 0 0 0 4px #eebd45}.square.target:after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;background:#172f4666;pointer-events:none}
.square:focus-visible{outline:3px solid #2966d6;outline-offset:-3px;z-index:1}.coord{position:absolute;font-size:11px;line-height:1;pointer-events:none;font-weight:600}.rank{left:3px;top:3px}.file{right:3px;bottom:3px}
#status{margin:8px 0;min-height:22px;font-size:14px}#promotion{background:#f4f1e9;padding:10px;border:1px solid #8b9d91;border-radius:5px;margin:8px 0}#promotion button{padding:9px;margin:3px;border:1px solid #7c9984;border-radius:4px;background:white;cursor:pointer}
#ghost{position:fixed;pointer-events:none;width:52px;height:52px;z-index:10;transform:translate(-50%,-50%)}#ghost svg{width:100%;height:100%}
</style></head>
<body><div id="wrap"><div id="board" role="group" aria-label="Chess puzzle board"></div><div id="promotion" hidden><strong>Promote to:</strong><div id="choices"></div></div><div id="status" role="status" aria-live="polite">Drag a piece, or select its square and destination.</div></div><div id="ghost" hidden></div>
<script>
// Streamlit's v1 iframe protocol. All assets are served locally.
const send=(type,data={})=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
const board=document.getElementById('board'), status=document.getElementById('status'), ghost=document.getElementById('ghost');
const promotion=document.getElementById('promotion');
let args=null, selected=null, drag=null, suppressClick=false;
function height(){send('streamlit:setFrameHeight',{height:document.getElementById('wrap').scrollHeight+8});}
function highlight(){
 for(const square of board.children){
  square.classList.toggle('selected',square.dataset.square===selected);
  square.classList.toggle('target',!!selected && args.legal.some(m=>m.slice(0,2)===selected && m.slice(2,4)===square.dataset.square));
 }
}
function reset(){selected=null;promotion.hidden=true;ghost.hidden=true;drag=null;highlight();height();}
function submit(uci){
 send('streamlit:setComponentValue',{value:{uci,fen:args.fen,event_id:crypto.randomUUID()},dataType:'json'});
 reset();status.textContent='Move submitted. See the result below the board.';
}
function attempt(from,to){
 const moves=args.legal.filter(m=>m.slice(0,4)===from+to);
 if(!moves.length){reset();status.textContent='Illegal move. Try another destination.';return;}
 if(moves.length===1){submit(moves[0]);return;}
 promotion.hidden=false;
 const choices=document.getElementById('choices');choices.replaceChildren();
 for(const code of ['q','r','b','n']){
  const move=moves.find(m=>m[4]===code);if(!move)continue;
  const button=document.createElement('button');button.textContent={q:'Queen',r:'Rook',b:'Bishop',n:'Knight'}[code];
  button.onclick=()=>submit(move);choices.append(button);
 }
 const cancel=document.createElement('button');cancel.textContent='Cancel';cancel.onclick=reset;choices.append(cancel);
 status.textContent='Choose your promotion piece.';height();
}
function select(square){
 if(selected && selected!==square){attempt(selected,square);return;}
 if(args.pieces[square]?.own){selected=selected===square?null:square;promotion.hidden=true;highlight();}
}
board.addEventListener('click',e=>{
 if(suppressClick){suppressClick=false;return;}
 const square=e.target.closest('[data-square]');if(square)select(square.dataset.square);
});
board.addEventListener('pointerdown',e=>{
 const square=e.target.closest('[data-square]');if(!square||e.button!==0)return;
 const from=square.dataset.square;if(!args.pieces[from]?.own)return;
 drag={from,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};board.setPointerCapture(e.pointerId);
});
board.addEventListener('pointermove',e=>{
 if(!drag)return;
 if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5)drag.moved=true;
 if(drag.moved){
  selected=drag.from;highlight();ghost.innerHTML=args.pieces[drag.from].svg;ghost.hidden=false;
  ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
 }
});
board.addEventListener('pointerup',e=>{
 if(!drag)return;
 const current=drag;drag=null;ghost.hidden=true;
 if(board.hasPointerCapture(e.pointerId))board.releasePointerCapture(e.pointerId);
 if(!current.moved)return;
 suppressClick=true;setTimeout(()=>suppressClick=false,0);
 const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-square]');
 if(target && target.dataset.square!==current.from)attempt(current.from,target.dataset.square);
 else reset();
});
board.addEventListener('pointercancel',reset);
document.addEventListener('keydown',e=>{if(e.key==='Escape')reset();});
window.addEventListener('message',e=>{
 if(e.source!==window.parent||e.data.type!=='streamlit:render')return;
 const incoming=e.data.args;
 if(args && args.fen===incoming.fen)return;
 args=incoming;selected=null;promotion.hidden=true;board.replaceChildren();
 const files=args.white?'abcdefgh':'hgfedcba', ranks=args.white?'87654321':'12345678';
 for(let row=0;row<8;row++)for(let col=0;col<8;col++){
  const square=files[col]+ranks[row],piece=args.pieces[square];
  const button=document.createElement('button');button.type='button';button.dataset.square=square;
  button.className='square'+((files.charCodeAt(col)-97+Number(ranks[row]))%2===1?' dark':'');
  button.setAttribute('aria-label',square+(piece?' '+piece.label:' empty'));
  if(piece)button.innerHTML=piece.svg;
  if(col===0){const label=document.createElement('span');label.className='coord rank';label.textContent=ranks[row];button.append(label);}
  if(row===7){const label=document.createElement('span');label.className='coord file';label.textContent=files[col];button.append(label);}
  board.append(button);
 }
 status.textContent='Drag a piece, or select its square and destination.';height();
});
new ResizeObserver(height).observe(document.getElementById('wrap'));
send('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
