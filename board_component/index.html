<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#24312c;background:transparent}
#wrap{max-width:460px;padding:4px}#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;touch-action:none;border:3px solid #394d42;border-radius:5px;overflow:hidden;user-select:none}
.square{position:relative;border:0;padding:0;display:grid;place-items:center;min-width:0;min-height:0;background:#ece6d5;cursor:pointer;border-radius:0;touch-action:none}
.dark{background:#7c9984}.square svg{width:88%;height:88%;pointer-events:none}.square.selected{box-shadow:inset 0 0 0 4px #eebd45}.square.last{background:#d6c780}.square.target:after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;background:#172f4666;pointer-events:none}
.square:focus-visible{outline:3px solid #2966d6;outline-offset:-3px;z-index:1}.coord{position:absolute;font-size:11px;line-height:1;pointer-events:none;font-weight:600}.rank{left:3px;top:3px}.file{right:3px;bottom:3px}
#status{margin:8px 0;min-height:22px;font-size:14px}#promotion{background:#f4f1e9;padding:10px;border:1px solid #8b9d91;border-radius:5px;margin:8px 0}
#promotion button,#replay{padding:9px;margin:3px;border:1px solid #7c9984;border-radius:4px;background:white;cursor:pointer}
#ghost{position:fixed;pointer-events:none;z-index:10;transform:translate(-50%,-50%)}#ghost svg{width:100%;height:100%}.moving-hidden>svg{visibility:hidden}
</style></head>
<body><div id="wrap"><div id="board" role="group" aria-label="Chess puzzle board"></div><div id="promotion" hidden><strong></strong><div id="choices"></div></div><div id="status" role="status" aria-live="polite"></div><button id="replay" hidden></button></div><div id="ghost" hidden></div>
<script src="board_state.js"></script><script src="board.js"></script>
</body></html>
