<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--board-light:#ffce9e;--board-dark:#d18b47;--board-border:#212121;--board-light-last:#cdd16a;--board-dark-last:#aaa23b}
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#212121;background:transparent}
#wrap{max-width:460px;padding:4px}#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;touch-action:none;border:3px solid var(--board-border);border-radius:5px;overflow:hidden;user-select:none}
.square{position:relative;border:0;padding:0;display:grid;place-items:center;min-width:0;min-height:0;background:var(--board-light);color:#212121;cursor:pointer;border-radius:0;touch-action:none}
.dark{background:var(--board-dark)}.square svg{width:88%;height:88%;pointer-events:none}.square.selected{box-shadow:inset 0 0 0 4px #eebd45}.square.last{background:var(--board-light-last)}.square.dark.last{background:var(--board-dark-last)}.square.target:after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;background:#4d2c1266;pointer-events:none}
.square:focus-visible{outline:3px solid #2966d6;outline-offset:-3px;z-index:1}.coord{position:absolute;font-size:11px;line-height:1;pointer-events:none;font-weight:600}.rank{left:3px;top:3px}.file{right:3px;bottom:3px}
.square.dragging svg{visibility:hidden}
.answer-badge{position:absolute;top:1%;right:1%;width:38%;height:38%;display:grid;place-items:center;border-radius:50%;pointer-events:none;z-index:3;box-shadow:0 2px 0 #0003}
.answer-correct{background:#81b64c}.answer-incorrect{background:#ff7468}
.answer-badge svg{width:72%;height:72%;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:square;stroke-linejoin:miter}
#status{margin:8px 0;min-height:22px;font-size:14px;color:var(--app-text,#212121)}#promotion{background:#fff3e6;padding:10px;border:1px solid var(--board-dark);border-radius:5px;margin:8px 0}
#promotion button,#continuation button{padding:9px;margin:3px;border:1px solid var(--board-dark);border-radius:4px;background:white;cursor:pointer}#continuation button:disabled{opacity:.45;cursor:default}
#ghost{position:fixed;pointer-events:none;z-index:10;transform:translate(-50%,-50%)}#ghost svg{width:100%;height:100%}
#retry{display:grid;place-items:center;width:96px;max-width:100%;height:40px;margin:10px auto;padding:8px;border:1px solid #ff8068;border-bottom:4px solid #b92520;border-radius:11px;background:linear-gradient(#ff4b38,#e82220);color:white;cursor:pointer;box-shadow:inset 0 2px 0 #ffffff3b}
#retry[hidden]{display:none}#retry svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#retry:hover{filter:brightness(1.08)}#retry:active{transform:translateY(2px)}#retry:focus-visible{outline:3px solid #2966d6;outline-offset:3px}
.square.hinted{background:#369b94}.square.dark.hinted{background:#29867f}
#hint{display:flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid #666;border-bottom:3px solid #222;border-radius:6px;background:linear-gradient(#4b4a46,#302f2c);color:#fff;font:700 16px system-ui;cursor:pointer;margin:10px 0}
#hint svg{width:24px;height:24px;fill:currentColor}#hint:hover{filter:brightness(1.12)}#hint:disabled{opacity:.45;cursor:default}
#continuation{display:flex;align-items:center;gap:20px;margin:8px 0}#continuation[hidden]{display:none}
#continuation button{display:grid;place-items:center;width:48px;height:48px;padding:6px;margin:0;border:0;background:transparent;color:#92928d;border-radius:6px}
#continuation button svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}#continuation button:hover:enabled{color:var(--app-text,#212121);background:#8882}
</style></head>
<body><div id="wrap"><div id="board" role="group" aria-label="Chess puzzle board"></div><div id="promotion" hidden><strong></strong><div id="choices"></div></div><div id="status" role="status" aria-live="polite"></div><button id="retry" type="button" aria-label="Try again" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6a8 8 0 1 1-2 8M3 3v6h6"/></svg></button><button id="hint" type="button" aria-label="Hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h6v2H9zm3-15a6 6 0 0 0-4 10.5c.7.6 1 1.4 1 2.5h6c0-1.1.3-1.9 1-2.5A6 6 0 0 0 12 5z"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1v1M4 4l1 1M1 11h1M20 4l-1 1M22 11h1"/></g></svg><span>Hint</span></button><div id="continuation" hidden><button id="back" type="button" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button><button id="forward" type="button" aria-label="Forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg></button></div></div><div id="ghost" hidden></div>
<script src="board_state.js"></script><script src="move_sound.js"></script><script src="board.js"></script>
</body></html>
