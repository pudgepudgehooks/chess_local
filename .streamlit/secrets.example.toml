# Paste into Community Cloud -> Settings -> Secrets. Keep actual values private.
# No Google/OAuth settings and no registration/invitation codes are needed.
[beta]
database_url = "postgresql://USER:PASSWORD@HOST/DATABASE?sslmode=require"
stockfish_path = "/usr/games/stockfish"

# Assign 1–4 users. Generate each hash using: python account_admin.py alice
# Replace this placeholder with the GENERATED hash. Never put a password here.
[beta.accounts.alice]
password_hash = "REPLACE-WITH-GENERATED-ARGON2ID-HASH"

# Add more accounts by copying a generated section, e.g. [beta.accounts.bob].
