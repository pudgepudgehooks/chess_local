# Copy into Community Cloud Advanced settings -> Secrets. Never commit real secrets.
[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "REPLACE-WITH-A-RANDOM-SECRET-AT-LEAST-32-BYTES"
client_id = "YOUR-GOOGLE-OAUTH-CLIENT-ID"
client_secret = "YOUR-GOOGLE-OAUTH-CLIENT-SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[beta]
# Use the provider's SSL-enabled connection string, e.g. ?sslmode=require.
database_url = "postgresql://USER:PASSWORD@HOST/DATABASE?sslmode=require"
allowed_emails = ["you@example.com", "friend@example.com"]
stockfish_path = "/usr/games/stockfish"
